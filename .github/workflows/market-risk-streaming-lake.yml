# Tests for market-risk-streaming-lake only. Path filters keep this job off unrelated folders.
name: market-risk-streaming-lake

on:
  pull_request:
    branches: [main]
    paths:
      - "market-risk-streaming-lake/**"
      - ".github/workflows/market-risk-streaming-lake.yml"
  push:
    branches: [main]
    paths:
      - "market-risk-streaming-lake/**"
      - ".github/workflows/market-risk-streaming-lake.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-risk-streaming-lake
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest
