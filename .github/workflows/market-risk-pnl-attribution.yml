# Tests for market-risk-pnl-attribution only. Path filters keep this job off unrelated folders.
name: market-risk-pnl-attribution

on:
  pull_request:
    branches: [main]
    paths:
      - "market-risk-pnl-attribution/**"
      - ".github/workflows/market-risk-pnl-attribution.yml"
  push:
    branches: [main]
    paths:
      - "market-risk-pnl-attribution/**"
      - ".github/workflows/market-risk-pnl-attribution.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest and ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-risk-pnl-attribution
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check --select E4,E7,E9,F src tests
