[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-pnl-attribution"
version = "0.1.0"
description = "Session P&L explain: market move versus quantity change, and a stated-beta factor split."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pnl", "attribution", "market-risk", "factors"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
pnl-attribution = "pnl_attribution.cli:main"

[project.urls]
Homepage = "https://github.com/wkwong2018/demo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pnl_attribution = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
